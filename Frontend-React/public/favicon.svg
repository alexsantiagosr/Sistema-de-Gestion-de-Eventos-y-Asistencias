  <line x1="28" y1="18" x2="40" y2="48" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="14" x2="40" y2="48" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
