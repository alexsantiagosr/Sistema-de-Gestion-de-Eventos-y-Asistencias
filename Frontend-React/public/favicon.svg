  <circle cx="48" cy="48" r="2.5" fill="rgba(255,255,255,0.7)"/>
  <!-- Seats Row 2 -->
  <circle cx="28" cy="39" r="2.5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="36" cy="37" r="2.5" fill="rgba(255,255,255,0.7)"/>
